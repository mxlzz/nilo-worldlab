name: WorldLab archive P3.2b pore water validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-p3-pore.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=evidence/P3/P32b
          mkdir -p "$d"
          gh api repos/${{ github.repository }}/actions/artifacts/15028176864/zip > "$d/15028176864.zip"
          echo '2a3b9131de3cad78e7e6bfe68bacc3684397028e72a6d1a113d6b83159b70606  '"$d/15028176864.zip" | sha256sum -c -
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/139240479939/logs > "$d/job-139240479939.log"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          d=pathlib.Path("evidence/P3/P32b")
          with zipfile.ZipFile(d/"15028176864.zip") as z:
              assert z.testzip() is None
              b=z.read("result.json");a=json.loads(b)
              assert not a["failed_preregistered_gates"] and len(a["analytic"])==5 and len(a["retained"])==5
              assert len(a["controls"])==8 and all(a["controls"].values())
              assert len(a["outputs"])==10
              assert {n for n in z.namelist() if not n.endswith("/")}==set(a["outputs"])|{"result.json"}
              for n,h in a["outputs"].items():assert hashlib.sha256(z.read(n)).hexdigest()==h
              old=json.loads(pathlib.Path("evidence/P3/P32b-failed/result.json").read_text())
              assert all(a["outputs"][n]==v for n,v in old["outputs"].items())
              assert a["retained"]["imposed_export"]["reference_comparison"]["halo_candidate_m3"]==.00002
              (d/"result.json").write_bytes(b)
          log=(d/"job-139240479939.log").read_text()
          assert [json.loads(l.split("WORLD_PORE_JSON ",1)[1]) for l in log.splitlines() if "WORLD_PORE_JSON {" in l]==[a]
          m={"run":45624348735,"job":139240479939,"artifact":15028176864,"files":{p.name:{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in d.iterdir() if p.is_file()}}
          (d/"archive_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'Archive P3.2b successful conservative pore-water remap'
          git pull --rebase origin main
          git push origin HEAD:main
