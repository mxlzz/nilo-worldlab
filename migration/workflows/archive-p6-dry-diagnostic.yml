name: WorldLab archive P6.1-D dry diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-p6-dry-diagnostic.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=evidence/P6/P61D
          mkdir -p "$d"
          gh api repos/${{ github.repository }}/actions/artifacts/15031921212/zip > "$d/15031921212.zip"
          echo '52aafbbbc3d59d956f6bd2a17f49a83411f70b7544656c1c9963f7b89295ed3a  '"$d/15031921212.zip" | sha256sum -c -
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/139268626494/logs > "$d/job-139268626494.log"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          d=pathlib.Path("evidence/P6/P61D")
          with zipfile.ZipFile(d/"15031921212.zip") as z:
              assert z.testzip() is None
              b=z.read("result.json");a=json.loads(b)
              assert a["failed_diagnostic_gates"]==[] and a["repeat_exact"]
              assert all(not c["eligible_hydraulic_candidate"] for c in a["cases"].values())
              assert a["input_owner_sha"]=="772e0b24764ea7751868038f42ddc244f4d97d34300afc6824a8e8c6c5f64611"
              for n,h in a["outputs"].items():assert hashlib.sha256(z.read(n)).hexdigest()==h
              assert set(z.namelist())==set(a["outputs"])|{"result.json"}
              (d/"result.json").write_bytes(b)
          log=(d/"job-139268626494.log").read_text()
          assert [json.loads(l.split("WORLD_DRY_DIAG_JSON ",1)[1]) for l in log.splitlines() if "WORLD_DRY_DIAG_JSON {" in l]==[a]
          m={"run":45632353847,"job":139268626494,"artifact":15031921212,"files":{p.name:{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in d.iterdir() if p.is_file()}}
          (d/"archive_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'Archive P6.1-D exact negative candidate diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
