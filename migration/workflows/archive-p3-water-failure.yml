name: WorldLab archive P3.1 initial instrumental failure
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-p3-water-failure.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=evidence/P3/P31-failed
          mkdir -p "$d"
          gh api repos/${{ github.repository }}/actions/artifacts/15017074351/zip > "$d/15017074351.zip"
          echo 'ec4173ddfd24930b8fbe09eca06c6502d4fbadcd83db6edafc09d6cf6aa805a8  '"$d/15017074351.zip" | sha256sum -c -
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/139176024762/logs > "$d/job-139176024762.log"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          d=pathlib.Path("evidence/P3/P31-failed")
          with zipfile.ZipFile(d/"15017074351.zip") as z:
              assert z.testzip() is None
              b=z.read("reference/result.json");a=json.loads(b)
              assert len(a["failed_preregistered_gates"])==5 and not a["cases"] and len(a["outputs"])==5
              for n,h in a["outputs"].items():assert hashlib.sha256(z.read("reference/"+n)).hexdigest()==h
              (d/"result.json").write_bytes(b)
          log=(d/"job-139176024762.log").read_text()
          assert [json.loads(l.split("WORLD_WATER_JSON ",1)[1]) for l in log.splitlines() if "WORLD_WATER_JSON {" in l]==[a]
          m={"run":45605745963,"job":139176024762,"artifact":15017074351,"files":{p.name:{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in d.iterdir() if p.is_file()}}
          (d/"archive_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'Archive P3.1 initialization failure'
          git pull --rebase origin main
          git push origin HEAD:main
