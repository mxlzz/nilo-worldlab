name: WorldLab authorized snapshot migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-worldlab.yml'
      - 'migration/transfer.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: worldlab-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copy source snapshot and archive available public research evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 migration/transfer.py
      - name: Commit and push verified snapshot without activating historical workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inherited MIGRATION_MANIFEST.json evidence/ARTIFACT_MANIFEST.json
          if [ -d evidence/archives ]; then git add evidence/archives; fi
          git diff --cached --stat | tail -n 1
          git commit -m "Migrate pinned WorldLab research snapshot and available evidence"
          git push origin HEAD:main
