name: WorldLab D2 AMD single authorized verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/worldlab-p1c-d2-amd.yml]
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  FIPY_SOLVERS: scipy
  PYTHONPATH: inherited/WORLD_RESEARCH/experiments:experiments
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify AMD allocation before scientific work
        run: |
          mkdir -p d2
          lscpu | tee d2/cpu.txt
          if grep -q AuthenticAMD /proc/cpuinfo; then echo 'AMD allocation confirmed'; else echo 'AMD unavailable; no diagnostic executed'; exit 1; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/
            /inherited/WORLD_RESEARCH/experiments/
            /evidence/P1-C/C2a/14977708755.zip
            /evidence/P1-C/C2a/14977883611.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.4.6 scipy==1.17.1 xarray==2026.9.0 fipy==4.0.3 pybullet==3.2.7 threadpoolctl==3.6.0
          python -m pip freeze
          lscpu
          for rep in 1 2; do
            env -u OPENBLAS_CORETYPE python experiments/p1c_d2_backend.py d2/native-$rep native
            OPENBLAS_CORETYPE=Nehalem python experiments/p1c_d2_backend.py d2/fixed-$rep fixed
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1c-d2-amd
          path: d2
          retention-days: 30
