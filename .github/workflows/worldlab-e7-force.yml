name: WorldLab E7.1a force instrument calibration
on:
  push:
    branches: [main]
    paths: [.github/workflows/worldlab-e7-force.yml]
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONPATH: inherited/WORLD_RESEARCH/experiments:experiments
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/e7_force_instrument.py
            /inherited/WORLD_RESEARCH/experiments/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.4.6 scipy==1.17.1 xarray==2026.9.0 pybullet==3.2.7
          python -m pip freeze
          lscpu
          python experiments/e7_force_instrument.py e7-force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e7-force-calibration
          path: e7-force
          retention-days: 30
