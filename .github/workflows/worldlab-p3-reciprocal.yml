name: WorldLab P3.3 reciprocal water terrain evolution
on:
  push:
    branches: [main]
    paths: [.github/workflows/worldlab-p3-reciprocal.yml]
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  reciprocal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/p3_reciprocal.py
            /experiments/p3_water.py
            /experiments/p3_pore.py
            /experiments/p3_exner.py
            /research/P3/RBD_SOURCE_MANIFEST.json
            /evidence/P3/RBD_SOURCE/source.zip
            /evidence/P3/RBD_SOURCE/archive_manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.5.5 scipy==1.18.1 xarray==2026.9.0 landlab==2.11.0
          python -m pip freeze
          lscpu
          mkdir p3-reciprocal
          python experiments/p3_reciprocal.py produce p3-reciprocal/reference p3-reciprocal/checkpoint
      - run: |
          mv rbd-upstream rbd-producer
          python experiments/p3_reciprocal.py consume p3-reciprocal/checkpoint p3-reciprocal/consumer
      - run: python experiments/p3_reciprocal.py compare p3-reciprocal/reference p3-reciprocal/consumer p3-reciprocal/compare.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-reciprocal
          path: p3-reciprocal
          retention-days: 30

# Retry with archived identical RBD bytes instead of raw HTTP downloads.
