name: WorldLab archive C2b failed exact restart and diagnose
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-p1c2b.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.4.6 xarray==2026.9.0 scipy==1.17.1
      - name: Preserve failure and inspect retained states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=evidence/P1-C/C2b
          mkdir -p "$d"
          gh api repos/${{ github.repository }}/actions/artifacts/14977979956/zip > "$d/14977979956.zip"
          gh api repos/${{ github.repository }}/actions/artifacts/14978404099/zip > "$d/14978404099.zip"
          echo '20d1856b2e76aa5ea4b8a9837a1833e87bca1d498a04d170178bd4fd99d83686  '"$d/14977979956.zip" | sha256sum -c -
          echo '6ed00ca9efe527f1239ee95bda02fe1d04f84e79cbd68c9dc7e8c1b321f3a147  '"$d/14978404099.zip" | sha256sum -c -
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/138883242535/logs > "$d/job-138883242535.log"
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/138884215130/logs > "$d/job-138884215130.log"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          d=pathlib.Path("evidence/P1-C/C2b")
          for artifact,job,marker,name in [(14977979956,138883242535,"WORLD_EVAL_JSON ","consumer.json"),(14978404099,138884215130,"WORLD_COMPARE_JSON ","compare.json")]:
              with zipfile.ZipFile(d/f"{artifact}.zip") as z:
                  assert z.testzip() is None
                  r=json.loads(z.read("result.json"))
                  for n,h in r.get("outputs",{}).items():assert hashlib.sha256(z.read(n)).hexdigest()==h,n
                  line=next(x for x in (d/f"job-{job}.log").read_text().splitlines() if marker+"{" in x)
                  assert json.loads(line.split(marker,1)[1])==r
                  (d/name).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
          python experiments/p1c_restart_diagnostic.py
          python - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path("evidence/P1-C/C2b")
          m={"run":45518264979,"jobs":[138883242535,138884215130],"artifacts":[14977979956,14978404099],"files":{p.name:{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in d.iterdir() if p.is_file()}}
          (d/"archive_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'Preserve failed exact restart and read-only diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
