name: WorldLab P1-C.2b-S exact restart and retrospective portability
on:
  push:
    branches: [main]
    paths: [experiments/p1c_portability.py, .github/workflows/worldlab-p1c2b-s.yml]
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  FIPY_SOLVERS: scipy
  PYTHONPATH: inherited/WORLD_RESEARCH/experiments:experiments
jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify producer CPU class before restart
        run: |
          lscpu
          grep -q GenuineIntel /proc/cpuinfo
          grep -q '6975P-C' /proc/cpuinfo
          test -z "${OPENBLAS_CORETYPE:-}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/
            /inherited/WORLD_RESEARCH/experiments/
            /evidence/P1-C/C2a/14977883611.zip
            /evidence/archives/45389348480/14917807888.zip
      - name: Remove git history and ensure no future evidence
        run: |
          rm -rf .git
          find evidence -type f
          test ! -e evidence/P1-C/C2a/14977708755.zip
          test ! -e evidence/P1-C/C2a/result.json
      - uses: actions/setup-python@v5
        id: landlab
        with:
          python-version: '3.13.18'
      - run: |
          "${{ steps.landlab.outputs.python-path }}" -m pip install --only-binary=:all: landlab==2.11.0 numpy==2.5.5 xarray==2026.9.0 scipy==1.18.1
          "${{ steps.landlab.outputs.python-path }}" -m pip freeze
      - uses: actions/setup-python@v5
        id: bullet
        with:
          python-version: '3.11.18'
      - run: |
          "${{ steps.bullet.outputs.python-path }}" -m pip install --only-binary=:all: fipy==4.0.3 pybullet==3.2.7 numpy==2.4.6 xarray==2026.9.0 scipy==1.17.1
          "${{ steps.bullet.outputs.python-path }}" -m pip freeze
          lscpu
      - run: |
          "${{ steps.bullet.outputs.python-path }}" experiments/p1c_restart_consumer.py "${{ steps.landlab.outputs.python-path }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1c-s1-consumer
          path: p1c-consumer
          retention-days: 30
  compare:
    needs: consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/p1c_compare_restart.py
            /evidence/P1-C/C2a/14977708755.zip
      - uses: actions/download-artifact@v4
        with:
          name: p1c-consumer
          path: p1c-consumer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.4.6
          python experiments/p1c_compare_restart.py evidence/P1-C/C2a/14977708755.zip p1c-consumer p1c-compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1c-s1-compare
          path: p1c-compare
          retention-days: 30
  portability:
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/p1c_portability.py
            /evidence/P1-C/C2a/14977708755.zip
            /evidence/P1-C/C2b/14977979956.zip
      - uses: actions/download-artifact@v4
        with:
          name: p1c-s1-compare
          path: p1c-compare
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.4.6 xarray==2026.9.0 scipy==1.17.1
          python experiments/p1c_portability.py evidence/P1-C/C2a/14977708755.zip evidence/P1-C/C2b/14977979956.zip p1c-compare p1c-portability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1c-s2-retrospective
          path: p1c-portability
          retention-days: 30
