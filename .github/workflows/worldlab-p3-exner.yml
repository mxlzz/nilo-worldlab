name: WorldLab P3.2a isolated native Exner compatibility
on:
  push:
    branches: [main]
    paths: [.github/workflows/worldlab-p3-exner.yml]
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  exner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/p3_exner.py
            /research/P3/RBD_SOURCE_MANIFEST.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.5.5 scipy==1.18.1 xarray==2026.9.0 landlab==2.11.0
          python -m pip freeze
          lscpu
          python experiments/p3_exner.py p3-exner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-exner
          path: p3-exner
          retention-days: 30
