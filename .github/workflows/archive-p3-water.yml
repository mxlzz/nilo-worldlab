name: WorldLab archive P3.1 water validation
on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-p3-water.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=evidence/P3/P31
          mkdir -p "$d"
          gh api repos/${{ github.repository }}/actions/artifacts/15018181616/zip > "$d/15018181616.zip"
          echo '77decdc094b3b2fbbb54eacb5e4221f2b72d4b23ab7b83f638720b97d3aa10e9  '"$d/15018181616.zip" | sha256sum -c -
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/139180177272/logs > "$d/job-139180177272.log"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          d=pathlib.Path("evidence/P3/P31")
          with zipfile.ZipFile(d/"15018181616.zip") as z:
              assert z.testzip() is None
              a=json.loads(z.read("reference/result.json"));b=json.loads(z.read("consumer/result.json"));c=json.loads(z.read("compare.json"));m=json.loads(z.read("checkpoint/manifest.json"))
              assert not a["failed_preregistered_gates"] and len(a["cases"])==5 and all(v["steps"]==960 for v in a["cases"].values())
              assert b["steps"]==480 and c["suffix_exact"] and all(b["controls"].values()) and len(b["controls"])==5
              assert c["final_owner_sha"]==b["final"]["owner_sha"]==a["cases"]["active"]["final"]["owner_sha"]
              assert m["owner_sha"]==b["input_owner_sha"]==a["cases"]["active"]["mid"]["owner_sha"]
              assert hashlib.sha256(z.read("checkpoint/owner.nc")).hexdigest()==m["sha256"]
              for prefix,x,n in [("reference/",a,20),("consumer/",b,2)]:
                  assert len(x["outputs"])==n
                  for name,h in x["outputs"].items():assert hashlib.sha256(z.read(prefix+name)).hexdigest()==h
              for name,path in [("reference.json","reference/result.json"),("consumer.json","consumer/result.json"),("compare.json","compare.json"),("checkpoint_manifest.json","checkpoint/manifest.json")]:
                  (d/name).write_bytes(z.read(path))
              expected={"reference/"+n for n in a["outputs"]}|{"consumer/"+n for n in b["outputs"]}|{"reference/result.json","consumer/result.json","checkpoint/manifest.json","checkpoint/owner.nc","compare.json"}
              assert {n for n in z.namelist() if not n.endswith("/")}==expected
          log=(d/"job-139180177272.log").read_text()
          for mark,v in [("WORLD_WATER_JSON ",a),("WORLD_WATER_RESTART_JSON ",b),("WORLD_WATER_COMPARE_JSON ",c)]:
              assert [json.loads(l.split(mark,1)[1]) for l in log.splitlines() if mark+"{" in l]==[v]
          m={"run":45606950182,"job":139180177272,"artifact":15018181616,"files":{p.name:{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in d.iterdir() if p.is_file()}}
          (d/"archive_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'Archive P3.1 successful hydrology and restart evidence'
          git pull --rebase origin main
          git push origin HEAD:main
