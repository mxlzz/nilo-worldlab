name: WorldLab archive P6.2A diversity
on:
  push:
    branches: [main]
    paths: [.github/workflows/worldlab-archive-p62a.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=evidence/P6/P62A
          mkdir -p "$d"
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15113821471/zip > "$d/p62-diversity.zip"
          python experiments/archive_p62a.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$d/p62-diversity.zip" "$d/archive_manifest.json"
          git commit -m "evidence: retain verified P6.2A diversity"
          git pull --rebase origin main
          git push origin HEAD:main
