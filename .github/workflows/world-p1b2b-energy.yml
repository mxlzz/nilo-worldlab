name: WorldLab P1-B.2b energy transport and native tracker
on:
  push:
    branches: [main]
    paths: [experiments/p1b2b_energy_transport.py, .github/workflows/world-p1b2b-energy.yml]
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONPATH: inherited/WORLD_RESEARCH/experiments
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: |
          python -m pip install --only-binary=:all: landlab==2.11.0 numpy==2.5.5 xarray==2026.9.0 scipy==1.18.1
          python -m pip freeze
          lscpu
      - run: python experiments/p1b2b_energy_transport.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1b2b-results
          path: p1b2b-output/
          retention-days: 30
