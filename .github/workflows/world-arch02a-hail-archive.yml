name: WorldLab archive HAIL retry
on:
  push:
    paths:
      - '.github/workflows/world-arch02a-hail-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=evidence/ARCH/HAIL-retry
          mkdir -p "$d"
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15088406154/zip > "$d/retry.zip"
          python experiments/ARCH/archive_hail_retry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$d/retry.zip" "$d/archive_manifest.json"
          git commit -m "evidence: retain verified HAIL retry"
          git pull --rebase origin main
          git push origin HEAD:main
