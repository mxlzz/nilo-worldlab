name: WorldLab P3.2b conservative pore-water remap
on:
  push:
    branches: [main]
    paths: [.github/workflows/worldlab-p3-pore.yml]
permissions:
  contents: read
env:
  NPY_DISABLE_CPU_FEATURES: X86_V3,X86_V4,AVX512_ICL,AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  pore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/p3_pore.py
            /experiments/p3_exner.py
            /evidence/P3/P32a/15021698022.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.5.5 scipy==1.18.1 xarray==2026.9.0 landlab==2.11.0
          python -m pip freeze
          lscpu
          python experiments/p3_pore.py p3-pore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-pore
          path: p3-pore
          retention-days: 30
